name: Daily run

on:
  schedule:
    - cron: "23 7 * * *" # every day at 07:23 UTC
  workflow_dispatch: # lets us start a run by hand from the Actions tab

# Only one run at a time, so two runs can never fight over the data files.
concurrency:
  group: daily-run

permissions:
  contents: write # commit the data files
  issues: write # open and close the daily issue

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read the job boards, build the history, and open the daily issue
        run: python -m watcher.run
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit the data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Daily data $(date -u +%F)"
            git push
          fi
