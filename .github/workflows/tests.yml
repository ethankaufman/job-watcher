name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7 # the Market numbers test runs the site's JavaScript
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: pytest
